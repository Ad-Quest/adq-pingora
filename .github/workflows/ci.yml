name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev
      - name: Set up Rust
        run: rustup update stable && rustup default stable
      - name: Build binary
        run: cargo build --locked --bin adq-pingora
      - name: Run unit tests
        run: cargo test --locked --lib --bins
      - name: Compile integration diagnostics
        run: cargo test --locked --test integration_tests --no-run
      - name: Run proxy smoke test
        run: python3 tests/smoke.py target/debug/adq-pingora
